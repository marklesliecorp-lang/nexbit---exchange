<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="Log in securely to your NEXBIT account.">
  <title>Log In | NEXBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="if(this.dataset.fallback){window.supabaseLoadFailed=true;this.onerror=null;}else{this.dataset.fallback='1';this.src='https://unpkg.com/@supabase/supabase-js@2';}"></script>
  <style>
    :root{color-scheme:dark;--gold:#e0b653;--gold-bright:#ffe4a0;--muted:#a7a196}
    *{box-sizing:border-box}
    html{min-height:100%;background:#070707}
    body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:Inter,Arial,sans-serif}
    a{color:inherit;text-decoration:none}
    .login-page{position:relative;isolation:isolate;overflow:hidden;min-height:100vh;display:grid;place-items:center;padding:38px 18px;background:radial-gradient(ellipse at 50% 28%,rgba(199,146,43,.17),transparent 40%),radial-gradient(ellipse at 8% 90%,rgba(130,84,18,.12),transparent 34%),linear-gradient(145deg,#080808,#050505 65%,#0b0905)}
    .login-grid{position:absolute;inset:0;z-index:-1;opacity:.13;background-image:linear-gradient(rgba(218,171,75,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(218,171,75,.11) 1px,transparent 1px);background-size:58px 58px;mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent)}
    .orb{position:absolute;z-index:-1;width:340px;height:340px;border-radius:50%;filter:blur(95px);background:rgba(213,157,48,.17);pointer-events:none;animation:drift 10s ease-in-out infinite alternate}
    .orb.one{top:2%;left:calc(50% - 410px)}.orb.two{right:calc(50% - 420px);bottom:0;background:rgba(126,83,20,.17);animation-delay:-4s}
    .login-shell{width:min(100%,440px);position:relative;text-align:center}
    .brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:30px;color:var(--gold-bright);font-size:29px;font-weight:900;letter-spacing:.17em;text-shadow:0 0 10px rgba(255,213,120,.72),0 0 28px rgba(214,158,47,.45);animation:brandGlow 3.2s ease-in-out infinite}
    .brand-mark{font-size:23px;color:#ffe7ad}
    .eyebrow{margin:0 0 10px;color:#dcb45d;font-size:9px;font-weight:800;letter-spacing:.25em}
    h1{margin:0;font-size:clamp(29px,6vw,38px);letter-spacing:-.045em;font-weight:800}
    .intro{margin:11px 0 26px;color:#aaa49a;font-size:13px;line-height:1.7}
    .login-card{padding:30px;border:1px solid rgba(225,180,85,.4);border-radius:18px;background:linear-gradient(145deg,rgba(25,23,19,.96),rgba(9,9,9,.98));box-shadow:0 25px 80px rgba(0,0,0,.62),0 0 38px rgba(207,151,42,.12),inset 0 1px 0 rgba(255,255,255,.05);text-align:left;backdrop-filter:blur(16px)}
    .field-label{display:block;margin:0 0 8px;color:#e9dfca;font-size:11px;font-weight:650}
    .field{width:100%;height:49px;margin:0 0 19px;padding:0 14px;border:1px solid #38342b;border-radius:9px;outline:none;background:rgba(4,4,4,.82);color:#fff;font:inherit;font-size:12px;transition:border-color .2s,box-shadow .2s}
    .field::placeholder{color:#77736c}.field:focus{border-color:#dfb454;box-shadow:0 0 0 3px rgba(217,173,80,.13)}
    .password-wrap{position:relative}.password-wrap .field{padding-right:67px}
    .toggle{position:absolute;right:9px;top:0;height:49px;padding:0 7px;border:0;background:transparent;color:#e8c36e;font-size:10px;font-weight:750;cursor:pointer}
    .form-options{display:flex;align-items:center;justify-content:flex-end;margin:-3px 0 22px}
    .forgot{color:#e8c36e;font-size:10px;font-weight:650}.forgot:hover{text-decoration:underline}
    .submit{width:100%;min-height:51px;display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:9px;background:linear-gradient(110deg,#ffe6a0 0%,#e1b34e 48%,#bd8122 100%);color:#171006;font-size:11px;font-weight:900;letter-spacing:.12em;cursor:pointer;box-shadow:0 8px 27px rgba(202,147,42,.27);transition:transform .2s,filter .2s,box-shadow .2s}
    .submit:hover{transform:translateY(-2px);filter:brightness(1.07);box-shadow:0 12px 32px rgba(202,147,42,.38)}.submit:disabled{opacity:.65;cursor:wait;transform:none}
    .message{display:none;margin:14px 0 0;padding:11px 12px;border-radius:8px;font-size:11px;line-height:1.6;text-align:center}
    .message.show{display:block}.message.error{color:#ffb4b8;background:rgba(190,54,65,.1);border:1px solid rgba(240,91,104,.28)}.message.success{color:#f2d58c;background:rgba(217,164,65,.09);border:1px solid rgba(217,164,65,.28)}
    .divider{display:flex;align-items:center;gap:12px;margin:23px 0 18px;color:#716c62;font-size:9px;letter-spacing:.12em}.divider:before,.divider:after{content:"";height:1px;flex:1;background:#302a20}
    .signup-note{margin:0;text-align:center;color:#999187;font-size:11px}.signup-note a{color:#f0cb78;font-weight:750}.signup-note a:hover{text-decoration:underline}
    .back-home{display:inline-block;margin-top:23px;color:#a7a196;font-size:10px}.back-home:hover{color:#f0cb78}
    .security{margin:18px 8px 0;color:#777166;font-size:9px;line-height:1.7}
    @keyframes brandGlow{0%,100%{text-shadow:0 0 8px rgba(255,213,120,.48),0 0 22px rgba(214,158,47,.3)}50%{text-shadow:0 0 15px rgba(255,225,157,.95),0 0 36px rgba(214,158,47,.62)}}
    @keyframes drift{from{transform:translate(-12px,-8px) scale(.92)}to{transform:translate(18px,15px) scale(1.12)}}
    @media(max-width:520px){.login-page{padding:30px 15px}.brand{font-size:26px;margin-bottom:25px}.login-card{padding:24px 18px;border-radius:15px}.orb{width:250px;height:250px;filter:blur(75px)}}
    @media(prefers-reduced-motion:reduce){.brand,.orb{animation:none}.submit{transition:none}}

    /* Premium glass treatment to match signup */
    .login-page{background:linear-gradient(145deg,#050609 0%,#090b10 48%,#030405 100%)}
    .login-grid{z-index:0;opacity:.11;background-image:linear-gradient(rgba(218,226,239,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(218,226,239,.12) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at center,#000 5%,transparent 78%)}
    .orb{z-index:0;width:500px;height:500px;filter:blur(42px);opacity:1;mix-blend-mode:screen}
    .orb.one{top:1%;left:calc(50% - 560px);background:radial-gradient(circle,rgba(255,218,139,.78) 0%,rgba(232,181,83,.55) 22%,rgba(208,151,55,.28) 48%,rgba(208,151,55,.08) 66%,transparent 76%)}
    .orb.two{right:calc(50% - 560px);bottom:-2%;background:radial-gradient(circle,rgba(221,235,255,.72) 0%,rgba(164,195,239,.48) 24%,rgba(126,160,211,.25) 49%,rgba(126,160,211,.07) 67%,transparent 77%)}
    .login-shell{z-index:1}
    .brand{color:#e6eaf0;text-shadow:0 0 9px rgba(220,229,241,.48),0 0 25px rgba(185,199,219,.3),0 0 48px rgba(217,174,83,.18);animation:none}
    .login-card{position:relative;overflow:hidden;padding:clamp(22px,5vw,30px);border:1px solid rgba(221,230,243,.2);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035) 48%,rgba(12,15,21,.52));box-shadow:0 28px 85px rgba(0,0,0,.62),0 0 55px rgba(150,174,207,.1),0 0 34px rgba(213,169,83,.08),inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%)}
    .login-card:before{content:"";position:absolute;inset:0 12% auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),rgba(225,190,119,.55),transparent);pointer-events:none}
    .field{border:1px solid rgba(207,218,235,.18);border-radius:11px;background:rgba(3,6,11,.38);box-shadow:inset 0 1px 2px rgba(0,0,0,.22)}
    .field:focus{border-color:rgba(221,190,125,.78);box-shadow:0 0 0 3px rgba(221,190,125,.12),0 0 20px rgba(221,190,125,.08)}
    .submit{border:1px solid rgba(255,255,255,.2);border-radius:11px;background:linear-gradient(110deg,#f0d99e 0%,#d6b36b 48%,#b98c43 100%);box-shadow:0 8px 28px rgba(199,157,78,.23),inset 0 1px 0 rgba(255,255,255,.55)}
    @media(max-width:520px){.orb{width:340px;height:340px;filter:blur(34px)}.orb.one{left:-145px;top:5%}.orb.two{right:-145px;bottom:3%}}


    /* NEXBIT transition shown after successful login */
    .nexbit-login-transition{position:fixed;z-index:99999;inset:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s ease,visibility .25s ease}
    .nexbit-login-transition.is-active{opacity:1;visibility:visible;pointer-events:auto}
    .nexbit-login-transition .nexbit-intro-wordmark{display:flex;align-items:center;justify-content:center;gap:.025em;font-family:Inter,Arial,sans-serif;font-size:clamp(48px,13vw,100px);font-weight:900;letter-spacing:.045em}
    .nexbit-login-transition .nexbit-intro-letter{display:inline-block;opacity:0;transform:translateY(35px) scale(.92);animation:nexbitLoginLetterRise .82s cubic-bezier(.2,.8,.2,1) forwards,nexbitLoginLetterFloat 1.1s ease-in-out .82s infinite alternate}
    .nexbit-login-transition .nexbit-intro-letter.gold{color:#e5bd65;text-shadow:0 0 3px rgba(229,189,101,.9),0 0 9px rgba(229,189,101,.45)}
    .nexbit-login-transition .nexbit-intro-letter.silver{color:#e3e7ec;text-shadow:0 0 3px rgba(227,231,236,.85),0 0 9px rgba(190,202,216,.4)}
    .nexbit-login-transition .nexbit-intro-letter:nth-child(1){animation-delay:0s,.82s}
    .nexbit-login-transition .nexbit-intro-letter:nth-child(2){animation-delay:.1s,.94s}
    .nexbit-login-transition .nexbit-intro-letter:nth-child(3){animation-delay:.2s,1.06s}
    .nexbit-login-transition .nexbit-intro-letter:nth-child(4){animation-delay:.3s,1.18s}
    .nexbit-login-transition .nexbit-intro-letter:nth-child(5){animation-delay:.4s,1.3s}
    .nexbit-login-transition .nexbit-intro-letter:nth-child(6){animation-delay:.5s,1.42s}
    @keyframes nexbitLoginLetterRise{to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes nexbitLoginLetterFloat{from{translate:0 -5px}to{translate:0 6px}}
    @media(prefers-reduced-motion:reduce){.nexbit-login-transition .nexbit-intro-letter{animation:none;opacity:1;transform:none}.nexbit-login-transition{transition:none}}
    /* Prevent iPhone Safari input auto-zoom without changing field dimensions or spacing */
    @media(max-width:520px){.field{font-size:16px}}

  </style>
</head>
<body>
  <main class="login-page">
    <div class="login-grid" aria-hidden="true"></div>
    <div class="orb one" aria-hidden="true"></div><div class="orb two" aria-hidden="true"></div>
    <section class="login-shell" aria-labelledby="loginTitle">
      <a class="brand" href="index.html" aria-label="NEXBIT home"><span>NEXBIT</span></a>
      <p class="eyebrow">WELCOME BACK</p>
      <h1 id="loginTitle">Log in to your account</h1>
      <p class="intro">Your NEXBIT account is just one step away.</p>
      <form class="login-card" id="nexbitLoginForm">
        <label class="field-label" for="loginEmail">Email Address</label>
        <input class="field" id="loginEmail" name="email" type="email" placeholder="Enter your email address" autocomplete="email" required>
        <label class="field-label" for="loginPassword">Password</label>
        <div class="password-wrap">
          <input class="field" id="loginPassword" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button class="toggle" id="togglePassword" type="button" aria-label="Show password">Show</button>
        </div>
        <div class="form-options"><a class="forgot" href="forgot-password.html">Forgot password?</a></div>
        <button class="submit" id="loginSubmit" type="submit">LOG IN <span aria-hidden="true">→</span></button>
        <p class="message" id="loginMessage" role="status" aria-live="polite"></p>
        <div class="divider">NEW TO NEXBIT?</div>
        <p class="signup-note">Don't have an account? <a href="signup.html">Create one</a></p>
      </form>
      <a class="back-home" href="index.html">← Back to homepage</a>
      <p class="security"><span aria-hidden="true">◆</span> Keep your password private. NEXBIT support will never ask you to share it.</p>
    </section>
  </main>
  <div class="nexbit-login-transition" id="nexbitLoginTransition" aria-label="NEXBIT">
    <div class="nexbit-intro-wordmark" aria-hidden="true">
      <span class="nexbit-intro-letter gold">N</span><span class="nexbit-intro-letter silver">E</span><span class="nexbit-intro-letter gold">X</span><span class="nexbit-intro-letter silver">B</span><span class="nexbit-intro-letter gold">I</span><span class="nexbit-intro-letter silver">T</span>
    </div>
  </div>
  <script>
    (function(){
  if(!window.supabase?.createClient){const notice=document.getElementById('loginMessage');if(notice){notice.textContent='Secure connection could not load. Please refresh or try again shortly.';notice.hidden=false;}console.error('NEXBIT: Supabase library failed to load.');return;}

      const form=document.getElementById('nexbitLoginForm');
      const emailField=document.getElementById('loginEmail');
      const passwordField=document.getElementById('loginPassword');
      const toggle=document.getElementById('togglePassword');
      const submit=document.getElementById('loginSubmit');
      const message=document.getElementById('loginMessage');
      const supabaseClient=window.supabase.createClient(
        'https://cubzhenuumvsogysmaeo.supabase.co',
        'sb_publishable_RqrGL9aFCgyzZsU9sRCzcw_zb2lCZ7N'
      );
      // Safari can restore the login page from its back-forward cache with the
      // previous login transition still visible. Reload that restored page.
      window.addEventListener('pageshow',function(event){
        if(event.persisted){
          window.setTimeout(function(){ window.location.reload(); },500);
        }
      });

      toggle.addEventListener('click',function(){
        const reveal=passwordField.type==='password';
        passwordField.type=reveal?'text':'password';
        toggle.textContent=reveal?'Hide':'Show';
        toggle.setAttribute('aria-label',reveal?'Hide password':'Show password');
      });
      form.addEventListener('submit',async function(event){
        event.preventDefault();
        message.className='message';
        message.textContent='';
        submit.disabled=true;
        submit.innerHTML='SIGNING IN...';
        try{
          const {data,error}=await supabaseClient.auth.signInWithPassword({
            email:emailField.value.trim(),
            password:passwordField.value
          });
          if(error) throw error;
          message.textContent='You are now logged in. Your secure session has been started.';
          message.className='message success show';
          passwordField.value='';
          submit.innerHTML='LOGGED IN ✓';
          message.textContent='Login successful. Taking you to your dashboard…';
          const signedInUser=data.user;
          const isAdmin=signedInUser?.email?.toLowerCase()==='markleslie.corp@gmail.com' && signedInUser?.app_metadata?.role==='admin';
          const destination=isAdmin?'admin.html':'dashboard.html';
          const transition=document.getElementById('nexbitLoginTransition');
          if(transition) transition.classList.add('is-active');
          window.setTimeout(function(){ window.location.assign(destination); }, 2000);
        }catch(error){
          console.error('NEXBIT login error:',error);
          message.textContent=error.message==='Invalid login credentials'
            ?'The email or password is incorrect. Please check your details and try again.'
            :error.message||'We could not log you in right now. Please try again.';
          message.className='message error show';
          submit.disabled=false;
          submit.innerHTML='LOG IN <span aria-hidden="true">→</span>';
        }
      });
    })();
  </script>
</body>
</html>
