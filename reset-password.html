<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#070707">
  <meta name="description" content="Choose a new password for your NEXBIT account."><title>Choose a New Password | NEXBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="if(this.dataset.fallback){window.supabaseLoadFailed=true;this.onerror=null;}else{this.dataset.fallback='1';this.src='https://unpkg.com/@supabase/supabase-js@2';}"></script>
  <style>
:root{color-scheme:dark;--gold:#e0b653;--gold-bright:#ffe4a0;--muted:#a7a196}
*{box-sizing:border-box}html{min-height:100%;background:#070707}body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}
.page{position:relative;isolation:isolate;overflow:hidden;min-height:100vh;display:grid;place-items:center;padding:38px 18px;background:linear-gradient(145deg,#050609 0%,#090b10 48%,#030405 100%)}
.grid{position:absolute;inset:0;z-index:0;opacity:.11;background-image:linear-gradient(rgba(218,226,239,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(218,226,239,.12) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at center,#000 5%,transparent 78%);pointer-events:none}
.glow,.orb{position:absolute;z-index:0;width:500px;height:500px;border-radius:50%;filter:blur(42px);opacity:1;mix-blend-mode:screen;pointer-events:none}
.glow,.orb.one{top:1%;left:calc(50% - 560px);background:radial-gradient(circle,rgba(255,218,139,.78) 0%,rgba(232,181,83,.55) 22%,rgba(208,151,55,.28) 48%,rgba(208,151,55,.08) 66%,transparent 76%)}
.orb.two{right:calc(50% - 560px);bottom:-2%;background:radial-gradient(circle,rgba(221,235,255,.72) 0%,rgba(164,195,239,.48) 24%,rgba(126,160,211,.25) 49%,rgba(126,160,211,.07) 67%,transparent 77%)}
.shell{width:min(100%,440px);position:relative;z-index:1;text-align:center}
.brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:30px;color:#e6eaf0;font-size:29px;font-weight:900;letter-spacing:.17em;text-shadow:0 0 9px rgba(220,229,241,.48),0 0 25px rgba(185,199,219,.3),0 0 48px rgba(217,174,83,.18)}
.mark{display:none}
.card{position:relative;overflow:hidden;padding:clamp(22px,5vw,30px);border:1px solid rgba(221,230,243,.2);border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035) 48%,rgba(12,15,21,.52));box-shadow:0 28px 85px rgba(0,0,0,.62),0 0 55px rgba(150,174,207,.1),0 0 34px rgba(213,169,83,.08),inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(24px) saturate(145%);-webkit-backdrop-filter:blur(24px) saturate(145%);text-align:left}
.card:before{content:"";position:absolute;inset:0 12% auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),rgba(225,190,119,.55),transparent);pointer-events:none}
.icon{width:48px;height:48px;display:grid;place-items:center;margin:0 auto 20px;border:1px solid rgba(221,230,243,.2);border-radius:14px;background:rgba(255,255,255,.045);color:#e4eaf2}.icon svg{width:23px;height:23px}
.eyebrow{margin:0 0 10px;color:#dcb45d;font-size:9px;font-weight:800;letter-spacing:.25em;text-align:center}
h1{margin:0;text-align:center;font-size:clamp(29px,6vw,38px);letter-spacing:-.045em;font-weight:800}
.intro{margin:11px auto 26px;max-width:340px;text-align:center;color:#aaaeb7;font-size:13px;line-height:1.7}
label{display:block;margin:0 0 8px;color:#e9edf4;font-size:11px;font-weight:650}
.field{width:100%;height:49px;margin:0 0 19px;padding:0 14px;border:1px solid rgba(207,218,235,.18);border-radius:11px;outline:none;background:rgba(3,6,11,.38);box-shadow:inset 0 1px 2px rgba(0,0,0,.22);color:#fff;font:inherit;font-size:12px;transition:border-color .2s,box-shadow .2s}
.field::placeholder{color:#858b96}.field:focus{border-color:rgba(221,190,125,.78);box-shadow:0 0 0 3px rgba(221,190,125,.12),0 0 20px rgba(221,190,125,.08)}
.submit{width:100%;min-height:51px;display:flex;align-items:center;justify-content:center;gap:12px;border:1px solid rgba(255,255,255,.2);border-radius:11px;background:linear-gradient(110deg,#f0d99e 0%,#d6b36b 48%,#b98c43 100%);color:#171006;font-size:11px;font-weight:900;letter-spacing:.12em;cursor:pointer;box-shadow:0 8px 28px rgba(199,157,78,.23),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .2s,filter .2s}
.submit:hover{transform:translateY(-2px);filter:brightness(1.07)}.submit:disabled{opacity:.65;cursor:wait;transform:none}
.message{display:none;margin:14px 0 0;padding:11px 12px;border-radius:8px;font-size:11px;line-height:1.6;text-align:center}.message.show{display:block}.message.error{color:#ffb4b8;background:rgba(190,54,65,.1);border:1px solid rgba(240,91,104,.28)}.message.success{color:#e7d5aa;background:rgba(217,164,65,.09);border:1px solid rgba(217,164,65,.28)}
.back{display:block;margin-top:22px;text-align:center;color:#e8c36e;font-size:11px;font-weight:700}.back:hover{text-decoration:underline}
.foot{margin:19px 8px 0;color:#8a8f99;font-size:9px;line-height:1.7;text-align:center}
@media(max-width:520px){.page{padding:30px 15px}.brand{font-size:26px;margin-bottom:25px}.card{padding:24px 18px;border-radius:15px}.glow,.orb{width:340px;height:340px;filter:blur(34px)}.glow,.orb.one{left:-145px;top:5%}.orb.two{right:-145px;bottom:3%}.field{font-size:16px}}
@media(prefers-reduced-motion:reduce){.submit{transition:none}}
</style>
</head>
<body><main class="page"><div class="grid" aria-hidden="true"></div><div class="orb two" aria-hidden="true"></div><section class="shell"><a class="brand" href="index.html">NEXBIT</a>
  <form class="card" id="newPasswordForm"><p class="eyebrow">SECURE ACCOUNT RECOVERY</p><h1>Choose a new password</h1><p class="intro">Create a strong password for your NEXBIT account. Use at least 8 characters.</p>
    <label for="newPassword">New Password</label><input class="field" id="newPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Enter your new password" required>
    <label for="confirmPassword">Confirm New Password</label><input class="field" id="confirmPassword" type="password" autocomplete="new-password" minlength="8" placeholder="Enter your password again" required>
    <button class="submit" id="savePassword" type="submit">UPDATE PASSWORD</button><p class="message" id="passwordMessage" role="status" aria-live="polite"></p><a class="back" href="login.html">← Back to log in</a>
  </form><p class="foot">If you did not request this change, do not continue. You can close this page.</p></section></main>
<script>
(function(){
  if(!window.supabase?.createClient){const notice=document.getElementById('passwordMessage');if(notice){notice.textContent='Secure connection could not load. Please refresh or try again shortly.';notice.hidden=false;}console.error('NEXBIT: Supabase library failed to load.');return;}

  const client=window.supabase.createClient('https://cubzhenuumvsogysmaeo.supabase.co','sb_publishable_RqrGL9aFCgyzZsU9sRCzcw_zb2lCZ7N');
  const form=document.getElementById('newPasswordForm'),password=document.getElementById('newPassword'),confirm=document.getElementById('confirmPassword'),button=document.getElementById('savePassword'),message=document.getElementById('passwordMessage');
  let recoveryReady=false;
  function show(text,type){message.textContent=text;message.className='message '+type+' show';}
  async function checkRecovery(){
    const hash=new URLSearchParams(window.location.hash.slice(1));
    const query=new URLSearchParams(window.location.search);
    const accessToken=hash.get('access_token')||query.get('access_token');
    const refreshToken=hash.get('refresh_token')||query.get('refresh_token');
    if(accessToken&&refreshToken){
      const {error}=await client.auth.setSession({access_token:accessToken,refresh_token:refreshToken});
      if(error)throw error;
    }
    const {data,error}=await client.auth.getSession();
    if(error)throw error;
    recoveryReady=!!data.session;
    if(!recoveryReady)show('This reset link is missing or has expired. Please request a new password-reset email.','error');
  }
  client.auth.onAuthStateChange(function(event,session){
    if(event==='PASSWORD_RECOVERY'&&session){recoveryReady=true;message.className='message';message.textContent='';}
  });
  checkRecovery().catch(function(error){console.error('NEXBIT recovery session error:',error);show('We could not validate this reset link. Please request a new one.','error');});
  form.addEventListener('submit',async function(event){
    event.preventDefault();message.className='message';message.textContent='';
    if(password.value.length<8){show('Your password must contain at least 8 characters.','error');return;}
    if(password.value!==confirm.value){show('The passwords do not match. Please try again.','error');return;}
    if(!recoveryReady){show('Please open the latest password-reset link from your email before continuing.','error');return;}
    button.disabled=true;button.textContent='UPDATING...';
    try{
      const {error}=await client.auth.updateUser({password:password.value});
      if(error)throw error;
      show('Your password has been updated successfully. You can now log in with your new password.','success');
      form.reset();button.textContent='PASSWORD UPDATED';
    }catch(error){console.error('NEXBIT password update error:',error);show(error.message||'We could not update your password. Please try again.','error');button.disabled=false;button.textContent='UPDATE PASSWORD';}
  });
})();
</script></body></html>
