<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Create your NEXBIT account.">
  <title>Sign Up | NEXBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=20261118-review-slider-compact2">
  <style>
    body.nexbit-intro-active{overflow:hidden}
    body.nexbit-intro-active .nexbit-signup-section{opacity:0;visibility:hidden}
    .nexbit-intro-screen{position:fixed;z-index:99999;inset:0;display:flex;align-items:center;justify-content:center;background:#050505;overflow:hidden;opacity:1;visibility:visible;transition:opacity .55s ease,visibility .55s ease}
    .nexbit-intro-screen:before,.nexbit-intro-screen:after{content:"";position:absolute;width:70vw;height:70vw;max-width:620px;max-height:620px;border-radius:50%;filter:blur(85px);pointer-events:none}
    .nexbit-intro-screen:before{background:rgba(190,150,65,.13);top:-42%;left:-18%}
    .nexbit-intro-screen:after{background:rgba(190,205,220,.12);bottom:-48%;right:-15%}
    .nexbit-intro-wordmark{position:relative;display:flex;align-items:center;justify-content:center;gap:.025em;font-family:Inter,Arial,sans-serif;font-size:clamp(48px,13vw,100px);font-weight:900;letter-spacing:.045em}
    .nexbit-intro-letter{display:inline-block;opacity:0;transform:translateY(35px) scale(.92);animation:nexbitLetterRise .82s cubic-bezier(.2,.8,.2,1) forwards,nexbitLetterFloat 1.1s ease-in-out .82s infinite alternate}
    .nexbit-intro-letter.gold{color:#e5bd65;text-shadow:0 0 8px rgba(229,189,101,.8),0 0 24px rgba(229,189,101,.55),0 0 48px rgba(229,189,101,.28)}
    .nexbit-intro-letter.silver{color:#e3e7ec;text-shadow:0 0 8px rgba(227,231,236,.75),0 0 24px rgba(190,202,216,.48),0 0 48px rgba(190,202,216,.24)}
    .nexbit-intro-letter:nth-child(1){animation-delay:0s,.82s}
    .nexbit-intro-letter:nth-child(2){animation-delay:.1s,.94s}
    .nexbit-intro-letter:nth-child(3){animation-delay:.2s,1.06s}
    .nexbit-intro-letter:nth-child(4){animation-delay:.3s,1.18s}
    .nexbit-intro-letter:nth-child(5){animation-delay:.4s,1.3s}
    .nexbit-intro-letter:nth-child(6){animation-delay:.5s,1.42s}
    @keyframes nexbitLetterRise{to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes nexbitLetterFloat{from{translate:0 -5px}to{translate:0 6px}}
    .nexbit-intro-screen.is-leaving{opacity:0;visibility:hidden;pointer-events:none}
    body.nexbit-intro-active .nexbit-signup-section.is-revealed{opacity:1;visibility:visible;transition:opacity .45s ease}
    @media(prefers-reduced-motion:reduce){.nexbit-intro-letter{animation:none;opacity:1;transform:none}.nexbit-intro-screen{transition:none}}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="if(this.dataset.fallback){window.supabaseLoadFailed=true;this.onerror=null;}else{this.dataset.fallback='1';this.src='https://unpkg.com/@supabase/supabase-js@2';}"></script>
</head>
<body class="nexbit-intro-active">
  <div class="nexbit-intro-screen" id="nexbitIntroScreen" aria-label="NEXBIT">
    <div class="nexbit-intro-wordmark" aria-hidden="true">
      <span class="nexbit-intro-letter gold">N</span><span class="nexbit-intro-letter silver">E</span><span class="nexbit-intro-letter gold">X</span><span class="nexbit-intro-letter silver">B</span><span class="nexbit-intro-letter gold">I</span><span class="nexbit-intro-letter silver">T</span>
    </div>
  </div>
  <!-- NEXBIT SIGNUP EXPERIENCE -->
  <section class="nexbit-signup-section" id="signup">
    <div class="signup-glow signup-glow-one" aria-hidden="true"></div>
    <div class="signup-glow signup-glow-two" aria-hidden="true"></div>
    <div class="signup-light-grid" aria-hidden="true"></div>
    <div class="signup-shell">
      <div class="signup-brand">
        <span class="signup-brand-mark">✦</span>
        <span>NEXBIT</span>
      </div>
      <p class="signup-kicker">YOUR NEXT MOVE STARTS HERE</p>
      <h2>Create Your Account</h2>
      <p class="signup-intro">Join NEXBIT and get started with your account.</p>
      <form class="signup-card" id="nexbitSignupForm">
        <label for="signupFullName">Full Name</label>
        <input id="signupFullName" name="fullName" type="text" placeholder="Enter your full name" autocomplete="name" required>
        <label for="signupEmail">Email Address</label>
        <input id="signupEmail" name="email" type="email" placeholder="Enter your email address" autocomplete="email" required>
        <label for="signupPassword">Password</label>
        <div class="signup-password-wrap">
          <input id="signupPassword" name="password" type="password" placeholder="Create a password" autocomplete="new-password" minlength="8" required>
          <button class="signup-password-toggle" type="button" data-target="signupPassword" aria-label="Show password">Show</button>
        </div>
        <label for="signupConfirmPassword">Confirm Password</label>
        <div class="signup-password-wrap">
          <input id="signupConfirmPassword" name="confirmPassword" type="password" placeholder="Confirm your password" autocomplete="new-password" minlength="8" required>
          <button class="signup-password-toggle" type="button" data-target="signupConfirmPassword" aria-label="Show confirm password">Show</button>
        </div>
        <label class="signup-terms">
          <input type="checkbox" id="signupTerms" required>
          <span>I agree to the <a href="index.html#terms-conditions">Terms &amp; Conditions</a> and <a href="index.html#privacy-policy">Privacy Policy</a>.</span>
        </label>
        <button class="signup-submit" type="submit">CREATE ACCOUNT <span aria-hidden="true">→</span></button>
        <p class="signup-form-message" id="signupFormMessage" role="status" aria-live="polite"></p>
        <p class="signup-login-note">Already have an account? <a href="login.html">Log In</a></p>
      </form>
      <p class="signup-security-note"><span aria-hidden="true">◆</span> Your details should only be submitted through a secure, verified NEXBIT registration service.</p>
    </div>
  </section>


<script>
(function(){
  const screen=document.getElementById('nexbitIntroScreen');
  const section=document.querySelector('.nexbit-signup-section');
  const reveal=()=>{
    if(screen)screen.classList.add('is-leaving');
    if(section)section.classList.add('is-revealed');
    document.body.classList.remove('nexbit-intro-active');
    if(screen)window.setTimeout(()=>screen.remove(),600);
  };
  window.setTimeout(reveal,2400);
})();
</script>
<script>
(function () {
  if(!window.supabase?.createClient){const notice=document.getElementById('signupFormMessage');if(notice){notice.textContent='Secure connection could not load. Please refresh or try again shortly.';notice.hidden=false;}console.error('NEXBIT: Supabase library failed to load.');return;}

  const form = document.getElementById('nexbitSignupForm');
  if (!form) return;

  const message = document.getElementById('signupFormMessage');
  const submitButton = form.querySelector('.signup-submit');
  const supabaseClient = window.supabase.createClient(
    'https://cubzhenuumvsogysmaeo.supabase.co',
    'sb_publishable_RqrGL9aFCgyzZsU9sRCzcw_zb2lCZ7N'
  );

  form.querySelectorAll('.signup-password-toggle').forEach(function (button) {
    button.addEventListener('click', function () {
      const field = document.getElementById(button.dataset.target);
      if (!field) return;
      const reveal = field.type === 'password';
      field.type = reveal ? 'text' : 'password';
      button.textContent = reveal ? 'Hide' : 'Show';
      button.setAttribute('aria-label', (reveal ? 'Hide ' : 'Show ') + 'password');
    });
  });

  form.addEventListener('submit', async function (event) {
    event.preventDefault();

    const fullName = document.getElementById('signupFullName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const confirm = document.getElementById('signupConfirmPassword').value;

    if (password !== confirm) {
      message.textContent = 'Your passwords do not match. Please check and try again.';
      document.getElementById('signupConfirmPassword').focus();
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = 'CREATING ACCOUNT...';
    message.textContent = '';

    try {
      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password,
        options: {
          data: { full_name: fullName },
          emailRedirectTo: 'https://nexbit-blf.pages.dev/verify-email.html'
        }
      });

      if (error) throw error;

      window.location.href = 'verify-email.html?email=' + encodeURIComponent(email);
      return;
    } catch (error) {
      console.error('NEXBIT registration error:', error);
      message.textContent = error.message || 'We could not create your account right now. Please try again.';
    } finally {
      submitButton.disabled = false;
      submitButton.innerHTML = 'CREATE ACCOUNT <span aria-hidden="true">→</span>';
    }
  });
})();
</script>
</body>
</html>
