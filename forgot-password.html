<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070707">
  <meta name="description" content="Reset your NEXBIT account password.">
  <title>Forgot Password | NEXBIT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="if(this.dataset.fallback){window.supabaseLoadFailed=true;this.onerror=null;}else{this.dataset.fallback='1';this.src='https://unpkg.com/@supabase/supabase-js@2';}"></script>
  <style>
    :root{color-scheme:dark;--gold:#e0b653;--bright:#ffe4a0;--muted:#aaa49a}
    *{box-sizing:border-box}html{min-height:100%;background:#070707}body{margin:0;min-height:100vh;background:#070707;color:#fff;font-family:Inter,Arial,sans-serif}a{color:inherit;text-decoration:none}
    .page{position:relative;isolation:isolate;overflow:hidden;min-height:100vh;display:grid;place-items:center;padding:36px 17px;background:radial-gradient(ellipse at 50% 27%,rgba(199,146,43,.17),transparent 42%),linear-gradient(145deg,#080808,#050505 65%,#0b0905)}
    .grid{position:absolute;inset:0;z-index:-1;opacity:.13;background-image:linear-gradient(rgba(218,171,75,.11) 1px,transparent 1px),linear-gradient(90deg,rgba(218,171,75,.11) 1px,transparent 1px);background-size:58px 58px;mask-image:linear-gradient(to bottom,transparent,#000 18%,#000 82%,transparent)}
    .glow{position:absolute;z-index:-1;width:330px;height:330px;border-radius:50%;filter:blur(95px);background:rgba(213,157,48,.16);pointer-events:none}
    .shell{width:min(100%,440px);text-align:center}.brand{display:inline-flex;align-items:center;gap:10px;margin-bottom:30px;color:var(--bright);font-size:29px;font-weight:900;letter-spacing:.17em;text-shadow:0 0 10px rgba(255,213,120,.72),0 0 28px rgba(214,158,47,.45);animation:pulse 3.2s ease-in-out infinite}.mark{font-size:23px}
    .card{padding:30px;border:1px solid rgba(225,180,85,.4);border-radius:18px;background:linear-gradient(145deg,rgba(25,23,19,.96),rgba(9,9,9,.98));box-shadow:0 25px 80px rgba(0,0,0,.62),0 0 38px rgba(207,151,42,.12),inset 0 1px 0 rgba(255,255,255,.05);text-align:left;backdrop-filter:blur(16px)}
    .icon{width:48px;height:48px;display:grid;place-items:center;margin:0 auto 20px;border:1px solid rgba(225,180,85,.45);border-radius:14px;background:rgba(218,171,75,.08);color:#f2cf7d}.icon svg{width:23px;height:23px}
    .eyebrow{text-align:center;margin:0 0 10px;color:#dcb45d;font-size:9px;font-weight:800;letter-spacing:.25em}h1{margin:0;text-align:center;font-size:clamp(27px,6vw,35px);letter-spacing:-.045em;font-weight:800}.intro{margin:11px auto 26px;max-width:330px;text-align:center;color:#aaa49a;font-size:12px;line-height:1.75}
    label{display:block;margin:0 0 8px;color:#e9dfca;font-size:11px;font-weight:650}.field{width:100%;height:49px;margin:0 0 19px;padding:0 14px;border:1px solid #38342b;border-radius:9px;outline:none;background:rgba(4,4,4,.82);color:#fff;font:inherit;font-size:12px}.field::placeholder{color:#77736c}.field:focus{border-color:#dfb454;box-shadow:0 0 0 3px rgba(217,173,80,.13)}
    .submit{width:100%;min-height:51px;display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:9px;background:linear-gradient(110deg,#ffe6a0 0%,#e1b34e 48%,#bd8122 100%);color:#171006;font-size:11px;font-weight:900;letter-spacing:.12em;cursor:pointer;box-shadow:0 8px 27px rgba(202,147,42,.27);transition:transform .2s,filter .2s}.submit:hover{transform:translateY(-2px);filter:brightness(1.07)}.submit:disabled{opacity:.65;cursor:wait;transform:none}
    .message{display:none;margin:14px 0 0;padding:11px 12px;border-radius:8px;font-size:11px;line-height:1.6;text-align:center}.message.show{display:block}.message.error{color:#ffb4b8;background:rgba(190,54,65,.1);border:1px solid rgba(240,91,104,.28)}.message.success{color:#f2d58c;background:rgba(217,164,65,.09);border:1px solid rgba(217,164,65,.28)}
    .back{display:block;margin-top:22px;text-align:center;color:#e8c36e;font-size:11px;font-weight:700}.back:hover{text-decoration:underline}.foot{margin:19px 8px 0;color:#777166;font-size:9px;line-height:1.7;text-align:center}
    @keyframes pulse{0%,100%{text-shadow:0 0 8px rgba(255,213,120,.48),0 0 22px rgba(214,158,47,.3)}50%{text-shadow:0 0 15px rgba(255,225,157,.95),0 0 36px rgba(214,158,47,.62)}}
    @media(max-width:520px){.page{padding:28px 15px}.brand{font-size:26px;margin-bottom:24px}.card{padding:25px 19px;border-radius:15px}}@media(prefers-reduced-motion:reduce){.brand{animation:none}.submit{transition:none}}
  </style>
</head>
<body>
  <main class="page"><div class="grid" aria-hidden="true"></div><div class="glow" aria-hidden="true"></div>
    <section class="shell" aria-labelledby="title">
      <a class="brand" href="index.html" aria-label="NEXBIT home"><span class="mark">✦</span><span>NEXBIT</span></a>
      <form class="card" id="resetRequestForm">
        <div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></div>
        <p class="eyebrow">ACCOUNT RECOVERY</p><h1 id="title">Forgot your password?</h1>
        <p class="intro">Enter the email address linked to your NEXBIT account. We’ll send you a secure link to choose a new password.</p>
        <label for="resetEmail">Email Address</label>
        <input class="field" id="resetEmail" name="email" type="email" placeholder="Enter your email address" autocomplete="email" required>
        <button class="submit" id="sendLink" type="submit">SEND RESET LINK <span aria-hidden="true">→</span></button>
        <p class="message" id="resetMessage" role="status" aria-live="polite"></p>
        <a class="back" href="login.html">← Back to log in</a>
      </form>
      <p class="foot">For your security, never share your password or password-reset link with anyone.</p>
    </section>
  </main>
  <script>
    (function(){
  if(!window.supabase?.createClient){const notice=document.getElementById('resetMessage');if(notice){notice.textContent='Secure connection could not load. Please refresh or try again shortly.';notice.hidden=false;}console.error('NEXBIT: Supabase library failed to load.');return;}

      const client=window.supabase.createClient('https://cubzhenuumvsogysmaeo.supabase.co','sb_publishable_RqrGL9aFCgyzZsU9sRCzcw_zb2lCZ7N');
      const form=document.getElementById('resetRequestForm'),email=document.getElementById('resetEmail'),button=document.getElementById('sendLink'),message=document.getElementById('resetMessage');
      form.addEventListener('submit',async function(event){
        event.preventDefault();message.className='message';message.textContent='';button.disabled=true;button.textContent='SENDING...';
        try{
          const {error}=await client.auth.resetPasswordForEmail(email.value.trim(),{redirectTo:'https://nexbit-blf.pages.dev/reset-password.html'});
          if(error)throw error;
          message.textContent='If an account exists for that email, a password-reset link has been sent. Please check your inbox and spam folder.';
          message.className='message success show';form.reset();
        }catch(error){
          console.error('NEXBIT password reset request error:',error);
          message.textContent=error.message||'We could not send the reset email. Please try again shortly.';
          message.className='message error show';
        }finally{button.disabled=false;button.innerHTML='SEND RESET LINK <span aria-hidden="true">→</span>';}
      });
    })();
  </script>
</body>
</html>
